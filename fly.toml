# Fly.io config for TiredVPN (TUN-capable server over TLS/TCP).
#
# Before the first deploy:
#   fly apps create <unique-name>        # then put it in `app` below
#   fly volumes create tiredvpn_data --size 1 --region fra
#   fly deploy
#   fly ips allocate-v4                  # dedicated IPv4, needed for raw TCP
#
# Secret and TLS cert are generated on first start and kept on the volume.
# Read the secret with: fly logs

app = "tiredvpn-change-me"
primary_region = "fra"

[build]
  dockerfile = "fly.Dockerfile"

[env]
  PORT = "443"
  DATA_DIR = "/data"
  # TUN mode: clients get addresses from this pool. Set to "" for proxy-only.
  TIREDVPN_IP_POOL = "10.8.0.0/24"

[mounts]
  source = "tiredvpn_data"
  destination = "/data"

# Raw TCP passthrough on 443 (no Fly TLS/HTTP handlers: TiredVPN does its own TLS).
[[services]]
  protocol = "tcp"
  internal_port = 443
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 443

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
